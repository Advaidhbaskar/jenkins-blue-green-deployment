
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blue-green-app
      version: green
  template:
    metadata:
      labels:
        app: blue-green-app
        version: green
    spec:
      containers:
        - name: flask-container
          image: advaidhb/blue-green-deployment:v1
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "2.0"
            - name: APP_COLOR
              value: "Green"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
